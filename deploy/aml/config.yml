# AML 排行榜入口（Open-source / Textual）专用配置。
#
# 派生自 aml-benchmark 的 evaluation/longmemeval/config.yml（调优检索栈：MiniLM API 精排、
# recall_max/rerank_max 300、rerank_fused_weight 0、text-embedding-v4 1024 维），整份内联而不用
# `extends`：本分支基线的 config_loader 尚不支持 extends，且基准配置的调优版本还没提交，继承会静默
# 退回旧值（精排关、recall_max 200）。基准配置再调整时需要手工同步本文件的检索段。
#
# 与基准配置的差异仅三处（其余逐行一致）：
# 1. ES 全文库加 `refresh: wait_for`——AML 的 Add 返回 200 即承诺“立即可检索”，而全文库默认
#    refresh=false，刚写入的文档约 1s 后才可搜，关键词召回路会漏掉；向量库 Milvus 默认 Strong 一致，
#    Redis 即时。
# 2. ES 索引 / Milvus 集合改为 aml_* 并用 AML_* 环境变量，与评测数据隔离。
# 3. Milvus 默认指向服务端 AML_MILVUS_URI（而非 Lite 文件），保证重启不丢数据。
#
# 模型约束（AML 本赛道固定）：LLM = gpt-4o-mini，Embedding = text-embedding-v4，均经环境变量注入
# （见 deploy/aml/.env.example），此处不写死端点或密钥。

profile: local

memory_api:
  globals:
    vector_enabled: true
    graph_enabled: false
    # API cross-encoder rerank (best setup in F09).
    rerank_enabled: true
    layers_index_enabled: true
    embedder_dim: 1024
    chunk_size: 1024

    llm_model: "${MODEL_NAME}"
    llm_base_url: "${API_BASE}"
    llm_api_key: "${API_KEY}"
    llm_temperature: 0.01
    llm_max_tokens: 4096

    embedder_model: "${EMBED_MODEL_NAME}"
    embedder_base_url: "${EMBED_BASE_URL}"
    embedder_api_key: "${EMBED_API_KEY}"
    # DashScope text-embedding-v4 单次请求最多 10 条输入
    embedder_max_batch: 10
    embedder_ssl_verify: false

  llm:
    default:
      target: openai
  embedder:
    default:
      target: openai
  tokenizer:
    default:
      target: jieba
  # Cohere-dialect /rerank endpoint; base_url includes /v1 but not /rerank.
  # RERANK_MODEL can switch to BAAI/bge-reranker-v2-m3 for comparison.
  reranker:
    default:
      target: api
      params:
        reranker_model: "${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}"
        reranker_base_url: "${RERANK_BASE_URL}"
        reranker_api_key: "${RERANK_API_KEY}"
        reranker_timeout: 30.0
        reranker_dialect: cohere

  # Use the official Mem2.0 extractor without task-specific construction or
  # retrieval changes. This file is evaluation-only wiring.
  extractor:
    default:
      target: llm
      params:
        llm: default
        chunker: default
  abstractor:
    default:
      target: llm
      params:
        llm: default
  associator:
    default:
      target: llm
      params:
        llm: default
        feature_extractor: default
        embedder: default
  classifier:
    default:
      target: llm
      params:
        llm: default
  evolver:
    default:
      target: orchestrating
      params:
        extractor: default
        abstractor: default
        associator: default
        index_builder: default
        kv_store: default
        graph_store: default
        dedup: default
        llm: default

  kv_store:
    default:
      target: redis
      params:
        url: "${REDIS_URL:-redis://127.0.0.1:6379/0}"
  fulltext_store:
    default:
      target: elasticsearch
      params:
        hosts: "${ES_HOSTS:-http://127.0.0.1:9200}"
        index: "${AML_ES_FULLTEXT_INDEX:-aml_fulltext}"
        refresh: wait_for
    layers_l0:
      target: elasticsearch
      params:
        hosts: "${ES_HOSTS:-http://127.0.0.1:9200}"
        index: "${AML_ES_FULLTEXT_INDEX_L0:-aml_fulltext_l0}"
        refresh: wait_for
    layers_l1:
      target: elasticsearch
      params:
        hosts: "${ES_HOSTS:-http://127.0.0.1:9200}"
        index: "${AML_ES_FULLTEXT_INDEX_L1:-aml_fulltext_l1}"
        refresh: wait_for
  vector_store:
    default:
      target: milvus
      params:
        uri: "${AML_MILVUS_URI:-http://127.0.0.1:19530}"
        collection: "${AML_MILVUS_COLLECTION:-aml_vectors}"
        dim: 1024
        # pymilvus 3.0 / Milvus Lite returns COSINE *distance* (0 is identical),
        # while Mem2.0 treats vector scores as higher-is-better.  IP equals
        # cosine only for L2-normalized vectors (true for BGE-M3; verify for
        # text-embedding-v4 before trusting vector scores).
        metric_type: IP
    layers_l0:
      target: milvus
      params:
        uri: "${AML_MILVUS_URI:-http://127.0.0.1:19530}"
        collection: "${AML_MILVUS_COLLECTION_L0:-aml_vectors_l0}"
        dim: 1024
        metric_type: IP
    layers_l1:
      target: milvus
      params:
        uri: "${AML_MILVUS_URI:-http://127.0.0.1:19530}"
        collection: "${AML_MILVUS_COLLECTION_L1:-aml_vectors_l1}"
        dim: 1024
        metric_type: IP

  fuser:
    default:
      target: weighted_rrf
      params:
        fusion_rrf_k: 20
        fusion_channel_weights:
          vector: 2.0
          keyword: 1.0
  recaller:
    keyword:
      target: keyword
      params:
        fulltext_store: default
    vector:
      target: vector
      params:
        vector_store: default
        min_similarity: 0.0
  query_parser:
    default:
      target: simple
      params:
        tokenizer: default
        embedder: default
        feature_extractor: default
        llm:
          target: echo
  retriever:
    default:
      target: pipeline
      params:
        keyword_recaller: keyword
        vector_recaller: vector
        graph_recaller: graph
        reranker: default
        query_parser: default
        fuser: default
        discloser: default
        kv_store: default
        over_fetch_factor: 4
        over_fetch_floor: 60
        # F09 / lme_kit preset ce_cap300: rerank up to 300 candidates, no
        # fused-score blend. The local embed_serve.py returns sigmoid scores
        # (all positive), so rerank_keep_non_positive is not needed.
        recall_max: 300
        rerank_max: 300
        min_score: 0.0
        min_score_ratio: 0.0
        min_score_ratio_uncalibrated: 0.0
        min_results: 0
        rerank_fused_weight: 0.0
