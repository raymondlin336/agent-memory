# AML server stack: adapter + MiniLM rerank server + Redis / Elasticsearch / Milvus (embedded mode).
#
# Run through ./aml-server.sh (it passes --env-file ../.env), or directly from this directory:
#   docker compose --env-file ../.env up -d --build
#
# Settings and keys come from deploy/aml/.env. Store addresses are fixed here (service names on the
# compose network), so the .env file only needs keys and model settings. The stores publish no ports:
# only the adapter is reachable from the host, on AML_BIND_ADDRESS:AML_PORT (127.0.0.1:8200 by default).
# With AML_DOMAIN set, the optional "https" profile adds Caddy on ports 80/443 with automatic TLS.
name: aml

# Cap container logs (Docker keeps them forever by default): 5 files x 50 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  redis:
    logging: *default-logging
    # Small init as PID 1: forwards signals and makes a crash of the service exit the container,
    # so restart: unless-stopped brings it back.
    init: true
    image: redis:7-alpine
    # Append-only file, fsync every second: at most ~1 s of writes lost on a crash.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    logging: *default-logging
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  milvus:
    logging: *default-logging
    # Embedded mode: Milvus runs its own etcd and keeps files on local disk, so no separate etcd or
    # object-store containers are needed. Everything persists in the milvus-data volume.
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
      - ./milvus-embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  rerank:
    logging: *default-logging
    # Small init as PID 1: forwards signals and makes a crash of the service exit the container,
    # so restart: unless-stopped brings it back.
    init: true
    build:
      context: ../../..
      dockerfile: deploy/aml/server/Dockerfile.rerank
      args:
        HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: aml-rerank:local
    restart: unless-stopped

  adapter:
    logging: *default-logging
    # Small init as PID 1: forwards signals and makes a crash of the service exit the container,
    # so restart: unless-stopped brings it back.
    init: true
    build:
      context: ../../..
      dockerfile: deploy/aml/server/Dockerfile.adapter
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: aml-adapter:local
    env_file:
      - ../.env
    # These win over ../.env: the stack always uses its own stores, reranker and ledger volume.
    environment:
      AML_IN_MEMORY: "0"
      REDIS_URL: redis://redis:6379/0
      ES_HOSTS: http://elasticsearch:9200
      AML_MILVUS_URI: http://milvus:19530
      RERANK_BASE_URL: http://rerank:8906/v1
      RERANK_API_KEY: local
      AML_STATE_DB: /data/aml_adapter_state.db
    volumes:
      - adapter-data:/data
    ports:
      - "${AML_BIND_ADDRESS:-127.0.0.1}:${AML_PORT:-8200}:8200"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      rerank:
        condition: service_healthy
    # SIGTERM shuts the adapter down cleanly; give an in-flight Add time to reach a group boundary.
    stop_grace_period: 60s
    restart: unless-stopped

  caddy:
    logging: *default-logging
    profiles: ["https"]
    image: caddy:2.8.4
    environment:
      AML_DOMAIN: ${AML_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      adapter:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  es-data:
  milvus-data:
  adapter-data:
  caddy-data:
  caddy-config:
